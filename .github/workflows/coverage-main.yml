name: Coverage (main)

# CodeScene accepts `cs-coverage upload` only for analysed branches, so
# main-branch coverage is uploaded here on push, and nowhere else. A pull
# request runs no CodeScene command at all: see "CodeScene coverage is owned
# by `main`" in the developers' guide, and `make test-codescene-boundary`,
# which asserts it. This workflow also advances the coverage ratchet
# baseline, through `coverage-baseline`: caches saved on main by an Ubicloud
# job are readable by every Ubicloud pull-request run, so the baseline written
# there is the one a pull request's ratchet compares against.

on:
  push:
    branches: [main]

# One group per ref, never cancelled. Runs never overlap, and a newer push
# replaces an older run still pending rather than queueing behind it. A
# cancelled run would abandon its upload and its ratchet baseline.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Measures coverage and uploads it to CodeScene on a GitHub-hosted runner
  # (free on a public repository). It advances no baseline: a hosted runner
  # writes GitHub's cache store, which the Ubicloud pull-request lanes never
  # read. It hands the figures on as an artefact for `coverage-baseline`, and
  # `coverage-warmup` writes the Ubicloud caches the lanes read.
  coverage-upload:
    runs-on: ubuntu-24.04
    # The CodeScene token lives in this environment, whose deployment policy
    # admits `main` alone; the codescene environment contract holds it to
    # this job.
    environment: codescene
    timeout-minutes: 65
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      # One binary cache shared by the warm-up step and the tests, so the
      # download happens before any test runs.
      PG_BINARY_CACHE_DIR: ${{ github.workspace }}/.pg-embedded/binaries
      # A throwaway password for the embedded test clusters, pinned so a
      # cluster directory left by one test process authenticates in the next.
      # Not a secret: the cluster listens on localhost inside this job.
      PG_PASSWORD: mxd-embedded-test
      # Coverage instrumentation needs LLVM; the development default is Cranelift.
      CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
      HX_BIN_DIR: ${{ github.workspace }}/.bin
      HX_WORK_ROOT: ${{ github.workspace }}/.cache/hx
      HX_SRC_LINK: ${{ github.workspace }}/.cache/synhx-client
      MXD_VALIDATOR_FAIL_CLOSED: "true"
      MXD_TEST_BIND_HOST: "127.0.0.1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: leynos/shared-actions/.github/actions/setup-rust@7d751eded578e48dacf43ab173d5820e6437c474
        with:
          install-sqlite-deps: true
          install-postgres-deps: true
          # trybuild's nested Cargo reads the linker flag from
          # .cargo/config.toml, so the linker has to be present here too.
          install-mold: true
          # No compiler cache on a hosted runner: it can only reach GitHub's
          # store, which throttles sccache's writes and which no Ubicloud lane
          # reads. The job compiles cold and costs nothing.
          use-sccache: false
      - name: Cache Cargo directories
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Add validator bin directory to PATH
        run: echo "${HX_BIN_DIR}" >> "${GITHUB_PATH}"
      - name: Install SynHX
        run: ./scripts/install-synhx.sh
      - name: Sanity-check hx does not report Helix
        run: |
          set -o pipefail
          timeout 1 hx --version 2>&1 | tee /tmp/hx-version.log || true
          if rg -qi 'helix' /tmp/hx-version.log; then
            echo "hx resolves to Helix, not SynHX" >&2
            exit 1
          fi
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Build wireframe server for coverage
        run: make validator-sqlite-server validator-postgres-server
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2  # v2.90.0
        with:
          tool: cargo-llvm-cov
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
      # The ratchet supports one baseline per job, so the sqlite leg
      # (the default feature set and broadest suite) carries it; the
      # postgres leg is generated unratcheted.
      - name: Generate coverage for SQLite
        uses: leynos/shared-actions/.github/actions/generate-coverage@f84a7def5646a6fc7ba77c1f486906f66a0fed96
        env:
          MXD_VALIDATOR_SERVER_BINARY: ${{ github.workspace }}/target/debug/mxd-wireframe-server
        with:
          features: sqlite test-support
          output-path: lcov-sqlite.info
          format: lcov
          artefact-name-suffix: sqlite-main
          with-ratchet: 'true'
          # No baseline is read or saved here; the figures travel to
          # `coverage-baseline` as an artefact.
          publish-baseline: never
          baseline-artefact-name: coverage-baseline-handover
      - name: Install pg-embed-setup-unpriv
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall --no-confirm pg-embed-setup-unpriv@0.7.0
      # pg-embed-setup-unpriv caches a cluster bootstrap failure for the rest
      # of a test process, so a download failing mid-suite would fail every
      # later test in that process. Downloading first leaves no download inside
      # the suite.
      # The binaries come from GitHub releases, and an anonymous request is
      # rate limited by the runner's address: a 403 there fails the warm-up.
      # An authenticated one is not.
      - name: Download the embedded PostgreSQL binaries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make warm-postgres
      - name: Generate coverage for Postgres
        uses: leynos/shared-actions/.github/actions/generate-coverage@f84a7def5646a6fc7ba77c1f486906f66a0fed96
        env:
          MXD_VALIDATOR_SERVER_BINARY: ${{ github.workspace }}/target/postgres/debug/mxd-wireframe-server
          NEXTEST_PROFILE: postgres
        with:
          with-default-features: false
          features: postgres test-support legacy-networking
          output-path: lcov-postgres.info
          format: lcov
          artefact-name-suffix: postgres-main
      - name: Merge coverage results
        run: bun x lcov-result-merger 'lcov-*.info' > lcov.info
      # The expression is evaluated before the shell runs, so the token enters
      # no process and no step's env: the composite upload action would pass
      # a step env on to its nested steps.
      - name: Check the CodeScene token is available
        id: codescene-token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Upload coverage data to CodeScene
        if: steps.codescene-token.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@f84a7def5646a6fc7ba77c1f486906f66a0fed96
        with:
          format: lcov
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}

  # Checks the handed-over figures against the stored baseline and saves them
  # under the key the pull-request ratchet restores. It runs on Ubicloud, the
  # cache store those lanes read, compiles nothing, and runs only when
  # `coverage-upload` passed, so a failed run never advances the baseline.
  coverage-baseline:
    needs: coverage-upload
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Publish the ratchet baseline
        uses: leynos/shared-actions/.github/actions/publish-coverage-baseline@f84a7def5646a6fc7ba77c1f486906f66a0fed96
        with:
          artefact-name: coverage-baseline-handover

  # Compiles the instrumented tests the pull-request lane builds, without
  # running them, so that lane's cache reads on Ubicloud hit. It depends on
  # nothing: a failing test is no reason to leave the cache cold.
  coverage-warmup:
    runs-on: ubicloud-standard-2
    timeout-minutes: 65
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      # Coverage instrumentation needs LLVM; the development default is Cranelift.
      CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: leynos/shared-actions/.github/actions/setup-rust@7d751eded578e48dacf43ab173d5820e6437c474
        with:
          install-sqlite-deps: true
          install-postgres-deps: true
          install-mold: true
      # No `Swatinem/rust-cache` here: its key carries the job id, so an entry
      # written by this job is never read by ci.yml's `coverage` lane. What the
      # lane does read from main is the setup-rust compiler cache and the
      # action's `Linux-llvmcov-*` archive, both written by the steps below.
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Build wireframe server for coverage
        run: make validator-sqlite-server validator-postgres-server
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2  # v2.90.0
        with:
          tool: cargo-llvm-cov
      - name: Compile the SQLite instrumented tests
        uses: leynos/shared-actions/.github/actions/generate-coverage@f84a7def5646a6fc7ba77c1f486906f66a0fed96
        with:
          features: sqlite test-support
          output-path: lcov-sqlite.info
          format: lcov
          build-only: 'true'
      - name: Compile the Postgres instrumented tests
        uses: leynos/shared-actions/.github/actions/generate-coverage@f84a7def5646a6fc7ba77c1f486906f66a0fed96
        with:
          with-default-features: false
          features: postgres test-support legacy-networking
          output-path: lcov-postgres.info
          format: lcov
          build-only: 'true'
