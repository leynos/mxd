name: Loom check

# The pull-request smoke check for the Loom models: it lints and compiles them
# under `--cfg loom`, runs the kernels' ordinary tests, and tests the model
# runner, but explores nothing. The exploration itself runs in loom.yml, daily
# and on demand. See "Loom models" in docs/developers-guide.md.

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/mxd-concurrency/**'
      - 'src/presence.rs'
      - 'src/wireframe/connection.rs'
      - 'scripts/run_loom_models.py'
      - 'tests/loom_runner/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/loom.yml'
      - '.github/workflows/loom-check.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leynos/shared-actions/.github/actions/setup-rust@872f59f53717b5bebe8e24b2f4a7496b089a939a
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Cache Cargo directories
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cfg-loom-release
      - name: Lint and compile the Loom models
        run: make check-loom
      - name: Test the shared-state kernels
        run: make test-concurrency
      - name: Test the Loom model runner
        run: make test-loom-runner
