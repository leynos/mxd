---
name: Release Dry Run

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A push to a pull request supersedes the run already in flight, and there is
# nothing left to learn from the superseded one. Only a pull request shares a
# group: every other event falls back to its own run id, so a push to `main`,
# a schedule or a dispatch is neither cancelled nor replaced while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release:
    # GitHub checks a reusable-workflow call before it starts any job, and
    # `release.yml`'s `release` job asks for `contents: write`. With the
    # workflow-level cap alone the call failed at startup on every pull
    # request, with no job and no check. The job is skipped in a dry run, so
    # write is never exercised here; test_reusable_permissions.py holds the
    # caller to what any callee job requests.
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      dry-run: true
    secrets: inherit
