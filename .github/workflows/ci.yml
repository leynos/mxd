name: CI

on:
  pull_request:
    branches: [main]

# A push to a pull request supersedes the run already in flight, and there is
# nothing left to learn from the superseded one. Only a pull request shares a
# group: every other event falls back to its own run id, so a push to `main`,
# a schedule or a dispatch is neither cancelled nor replaced while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-tooling:
    # Ubicloud, to avoid the hosted queue. A pull request from a fork cannot
    # obtain an Ubicloud runner, so it falls back to the hosted pool. Main's
    # Ubicloud coverage-upload writes the cache scope this reads.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    # Ceiling: twice the slowest observed run, rounded up to 5 (5 min, run 36971925629 on
    # this lane's first Ubicloud run). Provisional: the run restored the cargo registry
    # cache but found no compiled-artefact cache, so it is close to a cold build, and
    # it is resized from three green runs of this shape.
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MERMAN_CLI_VERSION: '0.7.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Rust for Merman
        run: rustup toolchain install 1.95.0
      - name: Cache Merman CLI
        id: cache-merman-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.3.0
        with:
          path: ~/.cargo/bin/merman-cli
          key: merman-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.MERMAN_CLI_VERSION }}
      - name: Install Merman CLI
        if: steps.cache-merman-cli.outputs.cache-hit != 'true'
        run: cargo +1.95.0 install merman-cli --version "=${MERMAN_CLI_VERSION}" --locked
      - name: Install Nixie
        run: uv tool install nixie-cli==1.1.0
      - name: Assert the workflow contracts
        run: make test-workflow-contracts
      - name: Enforce en-GB-oxendict spelling
        run: make spelling
      # A clean checkout passes the gate whether or not it enforces anything,
      # so the gate is also run against a fixture that must fail it.
      - name: Prove the spelling gate refuses a prohibited phrase
        run: make test-spelling-gate
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: '**/*.md'
      - name: Assert CodeScene coverage stays owned by main
        run: make test-codescene-boundary
      - name: Assert the Dependabot configuration holds what it must
        run: make test-dependabot-policy
      - name: Validate Mermaid diagrams
        run: make nixie

  build-test:
    permissions:
      contents: read
    # Ubicloud, to avoid the hosted queue. A pull request from a fork cannot
    # obtain an Ubicloud runner, so it falls back to the hosted pool. Main's
    # Ubicloud coverage-upload writes the cache scope this reads.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    # Ceiling: twice the slowest observed run, rounded up to 5 (24 min, the wireframe-only leg, run 36971925629 on
    # this lane's first Ubicloud run). Provisional: the run restored the cargo registry
    # cache but found no compiled-artefact cache, so it is close to a cold build, and
    # it is resized from three green runs of this shape.
    timeout-minutes: 50
    strategy:
      matrix:
        include:
          - name: postgres
            cargo_flags: --no-default-features --features postgres,test-support,legacy-networking
            install_postgres_deps: true
            install_sqlite_deps: false
          - name: sqlite
            cargo_flags: --features sqlite,test-support
            install_postgres_deps: false
            install_sqlite_deps: true
          - name: wireframe-only
            cargo_flags: --no-default-features --features sqlite,toml,test-support
            install_postgres_deps: false
            install_sqlite_deps: true
      fail-fast: false
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: leynos/shared-actions/.github/actions/setup-rust@7d751eded578e48dacf43ab173d5820e6437c474
        with:
          install-postgres-deps: ${{ matrix.install_postgres_deps }}
          install-sqlite-deps: ${{ matrix.install_sqlite_deps }}
      - name: Cache Cargo directories
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Before anything long runs: a lockfile the manifest does not admit is a
      # tree nothing here builds from, and every later step would silently
      # re-resolve it instead of failing.
      - name: Check the lockfile matches the manifest
        run: make check-locked
      - name: Install cargo-nextest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ! cargo nextest --version >/dev/null 2>&1; then
            cargo binstall --locked --no-confirm cargo-nextest
          fi
      # Every `cargo binstall` step sets GITHUB_TOKEN: an anonymous GitHub API
      # request is rate limited by runner address, and a 403 sends binstall to a
      # multi-minute source build. See the developers' guide, "Authenticated
      # binstall".
      # Dependency audits report advisories against the whole lockfile, so a
      # newly published advisory would fail every Dependabot PR regardless of
      # content and deadlock auto-merge. The scheduled audit workflow covers
      # Dependabot merges instead.
      - name: Install cargo-audit
        if: matrix.name == 'postgres' && github.actor != 'dependabot[bot]'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall --no-confirm cargo-audit
      - name: Audit dependencies
        if: matrix.name == 'postgres' && github.actor != 'dependabot[bot]'
        run: make audit
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@7d751eded578e48dacf43ab173d5820e6437c474
        with:
          version: "0.6.0"

      - name: Format
        run: make check-fmt
      - name: Lint with Clippy
        run: RUSTFLAGS="-D warnings" cargo clippy ${{ matrix.cargo_flags }} --workspace --all-targets -- -D warnings
      - name: Install Whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@7d751eded578e48dacf43ab173d5820e6437c474
      - name: Lint with Whitaker
        run: RUSTFLAGS="-D warnings" whitaker --all -- ${{ matrix.cargo_flags }} --all-targets
      # Only the wireframe-only leg runs tests here. The sqlite and postgres
      # legs stay for their Clippy and Whitaker passes, which lint feature sets
      # nothing else lints, but the coverage job runs their suites (SQLite with
      # default features, PostgreSQL with `legacy-networking`), so a second run
      # would only spend the minutes. Both backends stay first-class; see the
      # developers' guide, "Each backend runs once per event".
      - name: Test
        if: matrix.name == 'wireframe-only'
        run: |
          RSTEST_TIMEOUT=20 RUSTFLAGS="-D warnings" cargo nextest run ${{ matrix.cargo_flags }} \
            --filter-expr 'not package(=validator)'

  # One stable context for the ruleset to require. The matrix legs' check
  # names are truncated by GitHub and change with the matrix, so requiring them
  # directly is brittle. `always()` makes this job run when a leg fails; without
  # it the job would be skipped, and a skipped required check passes. Every
  # result other than success fails it, skipped and cancelled included.
  build-test-result:
    if: always()
    needs: build-test
    # It reads only the matrix result, so it holds no token permission.
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every build-test leg to succeed
        run: test "${{ needs.build-test.result }}" = success

  validator-sqlite:
    # Ubicloud, to avoid the hosted queue. A pull request from a fork cannot
    # obtain an Ubicloud runner, so it falls back to the hosted pool. Main's
    # Ubicloud coverage-upload writes the cache scope this reads.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    # Ceiling: twice the slowest observed run, rounded up to 5 (8 min, run 36971925629 on
    # this lane's first Ubicloud run). Provisional: the run restored the cargo registry
    # cache but found no compiled-artefact cache, so it is close to a cold build, and
    # it is resized from three green runs of this shape.
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      HX_BIN_DIR: ${{ github.workspace }}/.bin
      HX_WORK_ROOT: ${{ github.workspace }}/.cache/hx
      HX_SRC_LINK: ${{ github.workspace }}/.cache/synhx-client
      MXD_VALIDATOR_FAIL_CLOSED: "true"
      MXD_TEST_BIND_HOST: "127.0.0.1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: leynos/shared-actions/.github/actions/setup-rust@7d751eded578e48dacf43ab173d5820e6437c474
        with:
          install-sqlite-deps: true
      - name: Cache Cargo directories
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Add validator bin directory to PATH
        run: echo "${HX_BIN_DIR}" >> "${GITHUB_PATH}"
      - name: Install SynHX
        run: ./scripts/install-synhx.sh
      - name: Sanity-check hx does not report Helix
        run: |
          set -o pipefail
          timeout 1 hx --version 2>&1 | tee /tmp/hx-version.log || true
          if rg -qi 'helix' /tmp/hx-version.log; then
            echo "hx resolves to Helix, not SynHX" >&2
            exit 1
          fi
      - name: Build wireframe server for validator
        run: make validator-sqlite-server
      - name: Run validator harness
        run: make test-validator-sqlite

  coverage:
    permissions:
      contents: read
    # Ubicloud, to avoid the hosted queue. A pull request from a fork cannot
    # obtain an Ubicloud runner, so it falls back to the hosted pool. Main's
    # Ubicloud coverage-upload writes the cache scope this reads.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    # Ceiling: twice the slowest observed run, rounded up to 5 (28 min, run 36971925629 on
    # this lane's first Ubicloud run). Provisional: the run restored the cargo registry
    # cache but found no compiled-artefact cache, so it is close to a cold build, and
    # it is resized from three green runs of this shape.
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      # One binary cache shared by the warm-up step and the tests, so the
      # download happens before any test runs.
      PG_BINARY_CACHE_DIR: ${{ github.workspace }}/.pg-embedded/binaries
      # A throwaway password for the embedded test clusters, pinned so a
      # cluster directory left by one test process authenticates in the next.
      # Not a secret: the cluster listens on localhost inside this job.
      PG_PASSWORD: mxd-embedded-test
      HX_BIN_DIR: ${{ github.workspace }}/.bin
      HX_WORK_ROOT: ${{ github.workspace }}/.cache/hx
      HX_SRC_LINK: ${{ github.workspace }}/.cache/synhx-client
      MXD_VALIDATOR_FAIL_CLOSED: "true"
      MXD_TEST_BIND_HOST: "127.0.0.1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: leynos/shared-actions/.github/actions/setup-rust@7d751eded578e48dacf43ab173d5820e6437c474
        with:
          install-sqlite-deps: true
          install-postgres-deps: true
      - name: Cache Cargo directories
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Add validator bin directory to PATH
        run: echo "${HX_BIN_DIR}" >> "${GITHUB_PATH}"
      - name: Install SynHX
        run: ./scripts/install-synhx.sh
      - name: Sanity-check hx does not report Helix
        run: |
          set -o pipefail
          timeout 1 hx --version 2>&1 | tee /tmp/hx-version.log || true
          if rg -qi 'helix' /tmp/hx-version.log; then
            echo "hx resolves to Helix, not SynHX" >&2
            exit 1
          fi
      - name: Build wireframe server for coverage
        run: make validator-sqlite-server validator-postgres-server
      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: cargo-llvm-cov
      - uses: oven-sh/setup-bun@v2
      # The ratchet supports one baseline per job, so the sqlite leg
      # (the default feature set and broadest suite) carries it. The
      # authoritative baseline is the cache saved by coverage-main.yml
      # on main, which every PR run can restore; baselines saved here
      # stay scoped to the PR branch.
      - name: Generate coverage for SQLite
        uses: leynos/shared-actions/.github/actions/generate-coverage@7d751eded578e48dacf43ab173d5820e6437c474
        env:
          MXD_VALIDATOR_SERVER_BINARY: ${{ github.workspace }}/target/debug/mxd-wireframe-server
        with:
          features: sqlite test-support
          output-path: lcov-sqlite.info
          format: lcov
          artefact-name-suffix: sqlite
          with-ratchet: 'true'
      - name: Install pg-embed-setup-unpriv
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall --no-confirm pg-embed-setup-unpriv@0.5.2
      # pg-embed-setup-unpriv caches a cluster bootstrap failure for the rest
      # of a test process, so a download failing mid-suite would fail every
      # later test in that process. Downloading first leaves no download inside
      # the suite.
      # The binaries come from GitHub releases, and an anonymous request is
      # rate limited by the runner's address: a 403 there fails the warm-up.
      # An authenticated one is not.
      - name: Download the embedded PostgreSQL binaries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make warm-postgres
      - name: Generate coverage for Postgres
        uses: leynos/shared-actions/.github/actions/generate-coverage@7d751eded578e48dacf43ab173d5820e6437c474
        env:
          MXD_VALIDATOR_SERVER_BINARY: ${{ github.workspace }}/target/postgres/debug/mxd-wireframe-server
          NEXTEST_PROFILE: postgres
        with:
          with-default-features: false
          features: postgres test-support legacy-networking
          output-path: lcov-postgres.info
          format: lcov
          artefact-name-suffix: postgres
      - name: Merge coverage results
        run: bun x lcov-result-merger 'lcov-*.info' > lcov.info
