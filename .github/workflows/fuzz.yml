name: AFL Fuzzing

# A pull request that touches the lane runs it end to end for a short, bounded
# interval: build the image, fuzz the baked-in corpus, check that AFL produced
# output, triage. The nightly and dispatched runs fuzz for hours.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - fuzz/**
      - scripts/triage_crashes.sh
      - .github/workflows/fuzz.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FUZZ_HARNESS: /usr/local/bin/fuzz
      BUILD_PROFILE: debug
      FUZZ_DURATION: ${{ github.event_name == 'pull_request' && '120s' || '5h' }}

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Cache Cargo directories
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test the harness's case handling
        run: make test-fuzz-harness

      - name: Build fuzzing container
        run: docker build -t mxd-fuzz -f fuzz/Dockerfile .

      - name: Run AFL++
        continue-on-error: true
        run: |
          mkdir -p artifacts
          # The image carries its own seed corpus. afl-fuzz runs until stopped,
          # so interrupt it before the job timeout would cancel the upload.
          timeout --signal=INT "$FUZZ_DURATION" docker run --rm \
            -e AFL_SKIP_CPUFREQ=1 \
            -e AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES=1 \
            -v ${{ github.workspace }}/artifacts:/out \
            mxd-fuzz

      # Run AFL++ tolerates a failure so that the artefacts upload, which also
      # means a run that never started would pass. AFL writes `fuzzer_stats`
      # once it is running, and `execs_done` counts the cases it executed.
      - name: Check AFL++ ran
        run: |
          grep -E '^execs_done +: +[1-9]' artifacts/main/fuzzer_stats

      - name: Triage crashes
        if: always()
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            --entrypoint bash \
            mxd-fuzz \
            scripts/triage_crashes.sh artifacts/main/crashes "$FUZZ_HARNESS"

      - name: Upload crash corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crashes
          path: artifacts/main/crashes/unique

      - name: Upload full artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: artifacts
