# .config/nextest.toml
[profile.default]
# Kill any test once it crosses 60s.
slow-timeout = { period = "60s", terminate-after = 1, grace-period = "5s" }

# Put a hard ceiling on the whole run.
global-timeout = "10m"

# trybuild compiles both fixture crates inside this test, including during the
# coverage lane where a cold, instrumented build needs more time.
[[profile.default.overrides]]
filter = "package(rstest-bdd-ui-tests)"
slow-timeout = { period = "300s", terminate-after = 1, grace-period = "5s" }


# The postgres leg runs every database test against an embedded cluster.
# pg-embed-setup-unpriv 0.6 gives each cluster its own data directory under
# <root>/data, so tests no longer collide and the leg runs at the default
# parallelism; the single-slot test group that 0.5.x needed is gone. The
# profile stays because a cold cluster start is slower than the default 60 s
# slow timeout: one took 156 s on a quiet host.
[profile.postgres]
slow-timeout = { period = "300s", terminate-after = 1, grace-period = "5s" }
global-timeout = "60m"
