# .config/nextest.toml
[profile.default]
# Kill any test once it crosses 60s.
slow-timeout = { period = "60s", terminate-after = 1, grace-period = "5s" }

# Put a hard ceiling on the whole run.
global-timeout = "10m"

# The trybuild suite shells out to `cargo` for every fixture. trybuild runs
# `cargo clean --package` before each build, so the fixture package is rebuilt
# rather than reused, and those builds re-enter the shared compile-admission
# queue behind any other agent's work. A 300-second ceiling was already too
# tight on a loaded host, where the run-wide 10-minute `global-timeout` would
# also cut the subscription lane short.
#
# `global-timeout` cannot be overridden per package, so the headroom lives in a
# named profile selected by `NEXTEST_PROFILE=rstest-bdd-ui`, the same mechanism
# `test-postgres` uses for a cold cluster start.
[[profile.default.overrides]]
filter = "package(rstest-bdd-ui-tests)"
slow-timeout = { period = "900s", terminate-after = 1, grace-period = "5s" }

[profile.rstest-bdd-ui]
slow-timeout = { period = "900s", terminate-after = 1, grace-period = "5s" }
global-timeout = "30m"


# The postgres leg runs every database test against an embedded cluster.
# pg-embed-setup-unpriv 0.6 gives each cluster its own data directory under
# <root>/data, so tests no longer collide and the leg runs at the default
# parallelism; the single-slot test group that 0.5.x needed is gone. The
# profile stays because a cold cluster start is slower than the default 60 s
# slow timeout: one took 156 s on a quiet host.
[profile.postgres]
slow-timeout = { period = "300s", terminate-after = 1, grace-period = "5s" }
global-timeout = "60m"
