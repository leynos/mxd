[package]
name = "cli-defs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
description = "Shared CLI type definitions for mxd build and runtime"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
ortho_config = { workspace = true }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
argon2 = { version = "0.5", features = ["std"] }
rstest = { workspace = true }
anyhow = "1"
cap-std = { version = "4.0.0", features = ["fs_utf8"] }
tempfile = "3.23.0"
proptest = "1.4.0"

[features]
default = ["toml"]
toml = ["ortho_config/toml"]
json5 = ["ortho_config/json5"]
yaml = ["ortho_config/yaml"]
