[package]
name = "cli-defs"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Shared CLI type definitions for mxd build and runtime"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
ortho_config = "0.10.0"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
argon2 = { version = "0.5", features = ["std"] }
rstest = "0.27"

[features]
default = ["toml"]
toml = ["ortho_config/toml"]
json5 = ["ortho_config/json5"]
yaml = ["ortho_config/yaml"]
