# Align with CodeScene’s ceiling
cognitive-complexity-threshold = 9     # default is 25
too-many-arguments-threshold = 4       # default is 7
too-many-lines-threshold = 70          # default is 100
excessive-nesting-threshold = 4        # default is off

allow-expect-in-tests = true

# The workspace declares no `rust-version`, so Clippy would otherwise suggest
# APIs from the newest nightly (`Option::map_or_default`), which the older
# nightly that Whitaker lints on cannot compile. Clippy's `msrv` keeps its
# suggestions to what both toolchains accept.
msrv = "1.94.0"
