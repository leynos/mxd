# cargo-audit configuration. Every exception here is time-bound.
[advisories]
ignore = [
  # RUSTSEC-2026-0459: libsqlite3-sys before 0.39.0 bundles SQLite before
  # 3.54.0. Only the bundled SQLite copy is affected. libsqlite3-sys reaches
  # mxd only through diesel, and the latest diesel (2.3.14) requires
  # libsqlite3-sys <0.39.0, so no compatible fix exists.
  # Review by 2026-12-09. Ends when a diesel release allows libsqlite3-sys
  # 0.39 or later. Tracking: https://github.com/leynos/mxd/issues/709
  "RUSTSEC-2026-0459",
]
